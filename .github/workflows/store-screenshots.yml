name: Store screenshots

# Phone screenshots, icon and feature graphic for the Play Store listing, taken from the
# live web app and saved to the "store-assets" branch (store-assets/ folder).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [store/screenshots.mjs, .github/workflows/store-screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take screenshots
        run: |
          npm init -y >/dev/null
          npm install playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -qq fonts-noto-core >/dev/null
          node store/screenshots.mjs https://m4roon3d.github.io/nelabele/ shots

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: shots

      - name: Save to the store-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan store-assets
          git rm -rq --cached . || true
          mkdir -p store-assets && cp shots/*.png store-assets/
          git add store-assets
          git commit -qm "Play Store screenshots and graphics"
          git push -f origin store-assets
