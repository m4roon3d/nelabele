name: Build app

on:
  push:
    branches: [main]
    paths: [app/**, config/**, .github/workflows/build-app.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders aren't kept in the repo; generate them fresh.
      - name: Generate Android and web project files
        run: |
          flutter create --platforms=android,web --project-name nelabele --org app.nelabele .
          rm -rf test
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $manifest
          sed -i 's/android:label="nelabele"/android:label="NelaBele"/' $manifest
          # MapLibre needs Android 7.0 (API 24) or newer
          for g in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$g" ] && sed -i -E 's/minSdk( =|Version) flutter\.minSdkVersion/minSdk\1 24/' "$g" && grep -n "minSdk" "$g" || true
          done
          sed -i 's#<title>nelabele</title>#<title>NelaBele</title>#' web/index.html
          sed -i 's/"background_color": "[^"]*"/"background_color": "#FBF6EE"/; s/"theme_color": "[^"]*"/"theme_color": "#B4532A"/; s/"name": "nelabele"/"name": "NelaBele"/; s/"short_name": "nelabele"/"short_name": "NelaBele"/' web/manifest.json

      - run: flutter pub get

      - name: Generate app icons from the brand mark
        run: dart run flutter_launcher_icons

      - name: Check the code
        run: flutter analyze --no-fatal-infos lib

      - name: Build Android APKs
        run: |
          flutter build apk --release --split-per-abi --dart-define-from-file=../config/data_api.json
          flutter build apk --release --dart-define-from-file=../config/data_api.json

      - name: Build web app
        run: flutter build web --release --base-href /nelabele/ --dart-define-from-file=../config/data_api.json

      # Most phones: 64-bit ARM (smaller download). Universal: works everywhere.
      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-android
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-android-universal
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-web
          path: app/build/web
