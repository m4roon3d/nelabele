name: Build app

on:
  push:
    branches: [main]
    paths: [app/**, config/**, .github/workflows/build-app.yml]
  workflow_dispatch:

permissions:
  contents: write   # update the "app" release with the new APKs
  pages: write      # publish the web app
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders aren't kept in the repo; generate them fresh.
      - name: Generate Android and web project files
        run: |
          flutter create --platforms=android,web --project-name nelabele --org app.nelabele .
          rm -rf test
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $manifest
          sed -i 's/android:label="nelabele"/android:label="NelaBele"/' $manifest
          # Accept listings shared from other apps (text/plain)
          sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.SEND"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <data android:mimeType="text/plain"/>\n            </intent-filter>\n        </activity>#' $manifest
          grep -c "action.SEND" $manifest
          cp android_extra/MainActivity.kt "$(find android/app/src/main -name 'MainActivity.kt')"
          # MapLibre needs Android 7.0 (API 24) or newer
          for g in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$g" ] && sed -i -E 's/minSdk( =|Version) flutter\.minSdkVersion/minSdk\1 24/' "$g" && grep -n "minSdk" "$g" || true
          done
          sed -i 's#<title>nelabele</title>#<title>NelaBele</title>#' web/index.html
          sed -i 's/"background_color": "[^"]*"/"background_color": "#FBF6EE"/; s/"theme_color": "[^"]*"/"theme_color": "#B4532A"/; s/"name": "nelabele"/"name": "NelaBele"/; s/"short_name": "nelabele"/"short_name": "NelaBele"/' web/manifest.json

      - run: flutter pub get

      - name: Generate app icons from the brand mark
        run: dart run flutter_launcher_icons

      - name: Check the code
        run: |
          flutter analyze --no-fatal-infos lib
          dart run tool/check_listing.dart

      - name: Build Android APKs
        run: |
          flutter build apk --release --split-per-abi --dart-define-from-file=../config/data_api.json
          flutter build apk --release --dart-define-from-file=../config/data_api.json

      - name: Build web app
        run: flutter build web --release --base-href /nelabele/ --dart-define-from-file=../config/data_api.json

      # Most phones: 64-bit ARM (smaller download). Universal: works everywhere.
      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-android
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-android-universal
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nelabele-web
          path: app/build/web

      # One rolling release, so the download links never change:
      #   https://github.com/<repo>/releases/download/app/nelabele.apk
      - name: Publish APKs to the "app" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/app/outputs/flutter-apk
          cp $out/app-arm64-v8a-release.apk nelabele.apk
          cp $out/app-release.apk nelabele-universal.apk
          notes="NelaBele $(grep '^version:' pubspec.yaml | cut -d' ' -f2), built $(date -u +'%d %b %Y %H:%M UTC') from ${GITHUB_SHA::7}.

          - nelabele.apk: for most phones (64-bit)
          - nelabele-universal.apk: if the first one won't install"
          if gh release view app >/dev/null 2>&1; then
            gh release upload app nelabele.apk nelabele-universal.apk --clobber
            gh release edit app --notes "$notes"
          else
            gh release create app nelabele.apk nelabele-universal.apk --title "NelaBele app" --notes "$notes" --latest
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/build/web

  web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: deploy
        uses: actions/deploy-pages@v4
