name: Probe Near me
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Time old and new Near me queries as the app's role
        run: |
          psql "$DATABASE_URL" <<'SQL'
          \timing on
          SET ROLE anonymous;
          SET statement_timeout = '3s';
          SELECT count(*) AS old_box_rows FROM public.api_rate
           WHERE lat BETWEEN 12.886 AND 12.926 AND lon BETWEEN 77.5675 AND 77.6075;
          SELECT count(*) AS old_rural_box_rows FROM public.api_rate
           WHERE lat BETWEEN 13.164 AND 13.404 AND lon BETWEEN 77.478 AND 77.718;
          SELECT count(*) AS new_step1 FROM public.nearby_areas(12.906, 77.5875, 15);
          SELECT count(*) AS new_step2_rows FROM public.api_rate
           WHERE geo_area_id IN (SELECT id FROM public.nearby_areas(12.906, 77.5875, 15));
          SQL
