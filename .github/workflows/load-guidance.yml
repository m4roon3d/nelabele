name: Load data

on:
  workflow_dispatch:
    inputs:
      file:
        description: Parsed guidance CSV to load, or "all" for every file in data/guidance
        default: all
      effective_date:
        description: Date the guidance values took effect (YYYY-MM-DD), for files not listed in data/guidance/effective_dates.csv
        default: "2023-10-01"

permissions:
  contents: write   # publish the app's search index

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add your Neon connection string as the DATABASE_URL repository secret"
            exit 1
          fi

      - name: Create the schema if it doesn't exist yet
        run: |
          exists=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM pg_namespace WHERE nspname = 'nelabele'")
          if [ "$exists" = "1" ]; then
            echo "Schema already exists – skipping"
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/nelabele_schema.sql
          fi

      - name: Apply schema updates
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrate.sql

      - name: Update the city price trend
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/city_trend.sql

      - name: Apply the Data API layer
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/api.sql

      - name: Load guidance values
        env:
          FILE: ${{ inputs.file || 'all' }}
          EFFECTIVE: ${{ inputs.effective_date || '2023-10-01' }}
        run: |
          if [ "$FILE" = all ]; then files=(data/guidance/*.csv); else files=("$FILE"); fi
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = effective_dates.csv ] && continue
            # each gazette's own date (a revision is a new file with a later date)
            date=$(awk -F, -v n="$(basename "$f")" '$1 == n {print $2}' data/guidance/effective_dates.csv)
            echo "== $f (in force from ${date:-$EFFECTIVE})"
            python ingest/load_guidance.py "$f" --effective-date "${date:-$EFFECTIVE}"
          done

      - name: Load prices from published market reports
        run: python ingest/load_published.py data/market/published.csv

      - name: Put areas on the map
        run: python ingest/load_points.py data/geo/area_points.csv

      - name: Put village boundaries on the map
        run: python ingest/load_boundaries.py data/geo/village_boundaries.geojson

      - name: Build the app's search index
        run: |
          git fetch -q --depth 1 origin sources
          git show origin/sources:osm/places.json > "$RUNNER_TEMP/places.json"
          git show origin/sources:osm/roads.json > "$RUNNER_TEMP/roads.json"
          python ingest/search_index.py "$RUNNER_TEMP/places.json" "$RUNNER_TEMP/roads.json" data/search/index.json

      - name: Publish the search index
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/search/index.json
          if git diff --cached --quiet; then echo "Search index unchanged"; exit 0; fi
          git commit -qm "Update search index"
          git pull -q --rebase origin main && git push -q origin HEAD:main
