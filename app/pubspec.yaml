name: nelabele
description: Indicative land and property rates for Bangalore Urban and Rural.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  maplibre_gl: ^0.28.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# App icons, generated in CI from the NelaBele mark (brand/*.svg)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#B4532A"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FBF6EE"
    theme_color: "#B4532A"
